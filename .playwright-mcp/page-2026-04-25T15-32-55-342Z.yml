        - text: "- Fixed King's Rock, and Nature's Madness not showing up in the calc due to apostrophes (thanks Berry), added Mystical Fire to Guaranteed Atk/Sp Atk drop logic"
      - listitem [ref=e75]:
        - strong [ref=e76]: v1.2.3
        - text: "- Fixed bug with player mega form switching not updating player calcs (thanks neverknight)"
