    - heading "Changelog" [level=2] [ref=e10]
    - list [ref=e12]:
      - listitem [ref=e13]:
        - strong [ref=e14]: v2.5.3
        - text: "- Sleep Powder and Lovely Kiss can no longer be chosen when the player has a status condition"
      - listitem [ref=e15]:
        - strong [ref=e16]: v2.5.2
        - text: "- AI can't click leech seed on mons already leech seeded, Glare now correctly discentivized for electric types"
      - listitem [ref=e17]:
        - strong [ref=e18]: v2.5.1
        - text: "- Super Fang/Nature's Madness now correctly discentivize setup when showing fast 2HKO, Scary Face changed to be +6 when AI slower, added Magnet Rise warning"
      - listitem [ref=e19]:
        - strong [ref=e20]: v2.5.0
        - text: "- Fixed logic issue with Counter/Mirror Coat erroneously showing 0%, guaranteed atk/sp atk dropping moves showing 40% when they should be 0%, Obstruct follows protect logic"
      - listitem [ref=e21]:
        - strong [ref=e22]: v2.4.5
        - text: "- Fixed Cool Trainer Carolina & Cory Mega Lopunny ability"
      - listitem [ref=e23]:
        - strong [ref=e24]: v2.4.4
        - text: "- Wally VR Gardevoir ability now correctly shows Synchronize for base forme"
      - listitem [ref=e25]:
        - strong [ref=e26]: v2.4.3
        - text: "- Counter and Mirror Coat now correctly check Sash and Sturdy from full"
      - listitem [ref=e27]:
        - strong [ref=e28]: v2.4.2
        - text: "- Psywave now shows users level, like the AI sees for switch in and in battle"
      - listitem [ref=e29]:
        - strong [ref=e30]: v2.4.1
        - text: "- Fixed Kecleon's and Melmetal's weight to match the game (1/10th of the actual weight in RnB). Counter and Mirror Coat cannot be clicked into immunities, or clicked when they're useless."
      - listitem [ref=e31]:
        - strong [ref=e32]: v2.4.0
        - text: "- Changed Space Center Tag to one fight, Range Compare: added Iapapa Berry"
      - listitem [ref=e33]:
        - strong [ref=e34]: v2.3.0
        - text: "- Added Export All button"
      - listitem [ref=e35]:
        - strong [ref=e36]: v2.2.0
        - text: "- Color codings persist so you don't have to select them every time. Player Unburden mons only show doubled speed if the ability checkbox is checked"
      - listitem [ref=e37]:
        - strong [ref=e38]: v2.1.1
        - text: "- Added Breaking Swipe to Guaranteed Atk/SpAtk drop logic, weather can't be clicked if that weather is up"
      - listitem [ref=e39]:
        - strong [ref=e40]: v2.1.0
        - text: "- Open source once again! Link to repository and issue reporting added back to the credits, removed many package vulnerabilities"
      - listitem [ref=e41]:
        - strong [ref=e42]: v2.0.0
        - text: "- Added Range Compare, teams on top, fixed many bugs"
      - listitem [ref=e43]:
        - strong [ref=e44]: v1.3.9
        - text: "- Elite Four Drake Zygarde now has correct ability"
      - listitem [ref=e45]:
        - strong [ref=e46]: v1.3.8
        - text: "- Implemented Smack Down AI"
      - listitem [ref=e47]:
        - strong [ref=e48]: v1.3.7
        - text: "- Morning Sun, Synthesis, and Moonlight now properly calc even out of the sun. First Impression now has first turn out checkbox"
      - listitem [ref=e49]:
        - strong [ref=e50]: v1.3.6
        - text: "- Thunder Wave no longer sees it can para Limber mons"
      - listitem [ref=e51]:
        - strong [ref=e52]: v1.3.5
        - text: "- Bug Maniac Jeffrey now works as intended"
      - listitem [ref=e53]:
        - strong [ref=e54]: v1.3.4
        - text: "- Fixed issue with non-mega abilities transferring over when a different mon was chosen"
      - listitem [ref=e55]:
        - strong [ref=e56]: v1.3.3
        - text: "- Speed reducing moves now correctly observe type immunities"
      - listitem [ref=e57]:
        - strong [ref=e58]: v1.3.2
        - text: "- Mega Charizard's now update ability correctly"
      - listitem [ref=e59]:
        - strong [ref=e60]: v1.3.1
        - text: "- Grassy Glide now gets +1 Prio when it AI sees fast kill in Grassy Terrain, Self-Destruct procs AI Options to show up (thanks dylanrae)"
      - listitem [ref=e61]:
        - strong [ref=e62]: v1.3.0
        - text: "- Search bar searches by trainer name as well, added Toggleable Box search feature, toggles stay selected in between sessions"
      - listitem [ref=e63]:
        - strong [ref=e64]: v1.2.9
        - text: "- Parasol Lady Madeline and Camper Lawrence (Shed Shell double) show as one fight"
      - listitem [ref=e65]:
        - strong [ref=e66]: v1.2.8
        - text: "- Leech Seed no longer clicked against grass types for real oops"
      - listitem [ref=e67]:
        - strong [ref=e68]: v1.2.7
        - text: "- Leech Seed no longer clicked against grass types"
      - listitem [ref=e69]:
        - strong [ref=e70]: v1.2.6
        - text: "- Shell Smash AI now takes player's speed into account when testing if it dies"
      - listitem [ref=e71]:
        - strong [ref=e72]: v1.2.5
        - text: "- Added Scary Face to speed reducing moves logic"
      - listitem [ref=e73]:
